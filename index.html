<style>
:root{--bg:#F4F6FB;--sf:rgba(255,255,255,.74);--ink:#12203B;--mu:#56637C;--ln:rgba(18,32,59,.13);--a:#0B6E80;--a2:#6A4FD6;--ai:#fff;--tg:rgba(11,110,128,.11);box-sizing:border-box}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0B1220;--sf:rgba(23,33,58,.62);--ink:#EAF0FA;--mu:#9DABC6;--ln:rgba(255,255,255,.13);--a:#4FC3D6;--a2:#9B8CFF;--ai:#0B1220;--tg:rgba(79,195,214,.13)}}
:root[data-theme=dark]{--bg:#0B1220;--sf:rgba(23,33,58,.62);--ink:#EAF0FA;--mu:#9DABC6;--ln:rgba(255,255,255,.13);--a:#4FC3D6;--a2:#9B8CFF;--ai:#0B1220;--tg:rgba(79,195,214,.13)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.05rem/1.65 "Instrument Sans",system-ui,sans-serif;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(40% 40% at 18% 18%,color-mix(in srgb,var(--a) 26%,transparent),transparent),radial-gradient(36% 36% at 82% 28%,color-mix(in srgb,var(--a2) 24%,transparent),transparent),radial-gradient(40% 40% at 50% 92%,color-mix(in srgb,var(--a) 16%,transparent),transparent);animation:dr 20s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(4%,3%) scale(1.1)}}
h1,h2,h3{font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.1;margin:0}
p{margin:0 0 12px;max-width:68ch}
a{color:var(--a)}
button{font:inherit;color:inherit}
a:focus-visible,button:focus-visible{outline:3px solid var(--a);outline-offset:3px;border-radius:6px}
[hidden]{display:none!important}
#pg{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--a),var(--a2));z-index:30}
#nav{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:2px;align-items:center;max-width:calc(100% - 20px);overflow-x:auto;padding:6px;border:1px solid var(--ln);border-radius:999px;background:var(--sf);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);scrollbar-width:none}
#nav a,#nav button{color:var(--mu);text-decoration:none;font:500 .9rem/1 "Instrument Sans",sans-serif;padding:9px 13px;border-radius:999px;white-space:nowrap;background:none;border:0;cursor:pointer}
#nav a:hover,#nav button:hover{color:var(--ink);background:var(--tg)}
#nav button{border:1px solid var(--ln)}
.w{max-width:1080px;margin:0 auto;padding:0 22px}
.hero{min-height:100svh;display:grid;grid-template-columns:1.25fr .75fr;gap:40px;align-items:center;padding:110px 0 60px}
.hero h1{font-size:clamp(2.8rem,7vw,5.4rem);font-weight:800;letter-spacing:-.035em;background:linear-gradient(100deg,var(--ink) 30%,var(--a) 70%,var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.08em}
.hero .ey{color:var(--mu);margin-bottom:14px}
.rl{font:500 clamp(1.3rem,3vw,1.9rem)/1.3 "Bricolage Grotesque",sans-serif;margin:18px 0 14px}
.rot{display:inline-block;color:var(--a);animation:up .55s both}
@keyframes up{from{opacity:0;transform:translateY(.6em)}}
.hero .ht>*{animation:up .8s both}.hero .ht>:nth-child(2){animation-delay:.08s}.hero .ht>:nth-child(3){animation-delay:.16s}.hero .ht>:nth-child(4){animation-delay:.24s}.hero .ht>:nth-child(5){animation-delay:.32s}
.sub{color:var(--mu);font-size:1.12rem;max-width:52ch}
.ph{position:relative;width:min(100%,340px);aspect-ratio:1;margin:0 auto;border-radius:38% 62% 55% 45%/48% 42% 58% 52%;background:linear-gradient(135deg,var(--a),var(--a2));display:grid;place-items:center;color:#fff;font:800 4rem "Bricolage Grotesque",sans-serif;overflow:hidden;animation:mo 12s ease-in-out infinite alternate;box-shadow:0 0 0 6px var(--bg),0 0 0 8px var(--a)}
.phw{text-align:center}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
@keyframes mo{50%{border-radius:55% 45% 40% 60%/55% 55% 45% 45%}to{border-radius:45% 55% 60% 40%/40% 52% 48% 60%}}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-block;padding:12px 22px;border-radius:12px;font-weight:600;text-decoration:none;border:1px solid var(--a);color:var(--a)}
.btn.p{background:linear-gradient(100deg,var(--a),var(--a2));border-color:transparent;color:var(--ai)}
section{padding:72px 0 8px}
h2{font-size:clamp(1.8rem,4vw,2.5rem);font-weight:700;letter-spacing:-.02em;margin-bottom:26px}
h3{font-size:1.25rem;margin-bottom:8px}
h3.sm{font-size:1.1rem;margin:30px 0 14px}
.lead{font:500 clamp(1.35rem,3vw,1.8rem)/1.35 "Bricolage Grotesque",sans-serif;max-width:30ch;margin-bottom:18px}
.card{position:relative;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:24px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);overflow:hidden}
.proj::before,.doc::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;background:radial-gradient(280px circle at var(--mx,50%) var(--my,0),color-mix(in srgb,var(--a) 24%,transparent),transparent 70%)}
.proj:hover::before,.doc:hover::before{opacity:1}
.facts,.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(290px,1fr))}
.facts{grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-top:30px}
.facts b{display:block;font:800 2.4rem "Bricolage Grotesque",sans-serif;background:linear-gradient(100deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.mu,.facts span{color:var(--mu);font-size:.95rem}
.tl{border-left:2px solid var(--a);margin-left:8px;padding-left:26px}
.tli::after{content:"";position:absolute;left:-36px;top:30px;width:14px;height:14px;border-radius:50%;background:var(--a);box-shadow:0 0 0 4px var(--bg)}
.tl .card{overflow:visible;margin-bottom:16px}
.org{font:600 1.1rem "Bricolage Grotesque",sans-serif;color:var(--a);margin:0 0 4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filters button{border:1px solid var(--ln);background:var(--sf);padding:8px 16px;border-radius:999px;cursor:pointer}
.filters button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cat{display:inline-block;font-size:.82rem;color:var(--mu);margin-bottom:8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;padding:0;margin:8px 0 12px;list-style:none}
.tags li{background:var(--tg);border-radius:6px;padding:2px 10px;font-size:.85rem}
.lnk{font-weight:600;text-decoration:none;margin-right:12px}.lnk:hover{text-decoration:underline}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--ln);background:var(--sf);padding:6px 14px;border-radius:999px;text-decoration:none;font-size:.95rem;color:var(--ink)}
a.chip:hover{border-color:var(--a);color:var(--a)}
.paper{border-left:4px solid var(--a);margin-bottom:18px}
.paper ul,ul.pl{margin:0 0 12px;padding-left:20px;max-width:68ch}
.th{position:relative;aspect-ratio:4/3;border-radius:10px;overflow:hidden;margin-bottom:14px;background:var(--tg);display:grid;place-items:center;color:var(--mu);font-weight:600}
.th img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
.mail{display:block;font:700 clamp(1.4rem,4vw,2.3rem) "Bricolage Grotesque",sans-serif;word-break:break-all;text-decoration:none;margin:6px 0}
footer{padding:60px 0 90px;color:var(--mu);font-size:.9rem}
footer button{background:none;border:1px solid var(--ln);border-radius:999px;padding:4px 14px;cursor:pointer;color:var(--mu)}
body:not(.edit) [data-p]:empty{display:none}
.edit [data-p]{outline:1px dashed color-mix(in srgb,var(--a) 55%,transparent);outline-offset:2px;border-radius:3px;cursor:text;min-width:2ch}
.edit [data-p]:focus{outline:2px solid var(--a)}
.edit [data-p]:empty::before{content:"(empty, click to edit)";opacity:.5}
.x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;border:0;background:#C0392B;color:#fff;cursor:pointer;z-index:2}
.pr,.add{border:1px solid var(--a);background:var(--tg);border-radius:8px;padding:3px 10px;font-size:.82rem;cursor:pointer;margin:4px 6px 0 0}
.add{margin-top:14px;padding:8px 16px;font-size:.95rem}
#bar,#toast{position:fixed;left:50%;transform:translateX(-50%);z-index:40;border:1px solid var(--ln);background:var(--sf);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px}
#bar{bottom:calc(14px + env(safe-area-inset-bottom,0px));display:none;gap:8px;padding:10px 14px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 20px)}
.edit #bar{display:flex}
#bar button{border:1px solid var(--a);background:var(--tg);border-radius:10px;padding:6px 14px;cursor:pointer}
#bar #pub{background:var(--a);color:var(--ai)}
#toast{bottom:calc(84px + env(safe-area-inset-bottom,0px));padding:10px 18px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding-top:96px}.phw{order:-1}.ph{width:min(70vw,260px)}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

<section id="research"><h2>Research and publications</h2>${D.research.map((r,i)=>`<div class="card paper">${del('research',i)}${t(`research.${i}.k`,'span','cat')}<h3>${t(`research.${i}.t`)}</h3><ul>${r.b.map((s,j)=>`<li>${t(`research.${i}.b.${j}`)}</li>`).join('')}</ul>${a(r.u,'Read the paper','lnk')}${pr(`research.${i}.u`,'Paper URL','Edit link')}</div>`).join('')}${add('research','research')}</section>
<section id="skills"><h2>Skills</h2><div class="grid">${D.skills.map((s,i)=>`<div class="card">${del('skills',i)}<h3 class="sm" style="margin-top:0">${t(`skills.${i}.g`)}</h3>${tags(s.v)}${E?t(`skills.${i}.v`,'p','mu'):''}</div>`).join('')}</div>${add('skills','skill group')}</section>
<section id="education"><h2>Education and activities</h2><div class="card"><h3>${t('edu.t')}</h3>${t('edu.m','p','mu')}<p><b>${t('edu.a')}</b></p><ul class="pl">${D.edu.b.map((s,j)=>`<li>${t(`edu.b.${j}`)}</li>`).join('')}</ul></div></section>
<section id="documents"><h2>Documents and references</h2><div class="grid">${D.docs.map((x,i)=>`<article class="card doc">${del('docs',i)}<div class="th"><span>PDF</span>${x.i?`<img src="${esc(x.i)}" alt="" loading="lazy" onerror="this.remove()">`:''}</div>${t(`docs.${i}.k`,'span','cat')}${t(`docs.${i}.t`,'h3')}${t(`docs.${i}.d`,'p')}${a(x.f,'View document','lnk')}${pr(`docs.${i}.f`,'File path (docs/name.pdf) or URL','File path')}${up(`docs.${i}.f`,'Upload file')}${up(`docs.${i}.i`,'Upload preview image')}</article>`).join('')}</div>${add('docs','document')}
<h3 class="sm">References</h3><div class="grid">${D.refs.map((x,i)=>`<article class="card">${del('refs',i)}<h3>${t(`refs.${i}.n`)}</h3>${t(`refs.${i}.r`,'p','mu')}${E?t(`refs.${i}.e`,'p','mu'):x.e?`<p><a href="mailto:${esc(x.e)}">${esc(x.e)}</a></p>`:''}${a(x.f,'Read recommendation letter','lnk')}${pr(`refs.${i}.f`,'Letter path or URL','Letter path')}${up(`refs.${i}.f`,'Upload letter')}</article>`).join('')}</div>${add('refs','reference')}</section>
<section id="contact"><h2>Contact</h2>${t('contactLine','p')}${lk('mailto:'+c.email,t('contact.email'),'mail')}${lk('tel:'+String(c.phone).replace(/[^+\d]/g,''),t('contact.phone'),'mail')}
<div class="btns">${a(c.li,'LinkedIn','btn p')}${a(c.gh,'GitHub')}${a(c.cv,'View CV')}</div>${E?`<p>${pr('contact.li','LinkedIn URL','LinkedIn link')}${pr('contact.gh','GitHub URL','GitHub link')}${pr('contact.cv','CV URL','CV link')}</p>`:''}</section>
</main>
<footer class="w">© ${new Date().getFullYear()} ${esc(D.name)} ${E?'<button id="ed" type="button">Editing</button>':''}</footer>`;
if(E)document.querySelectorAll('[data-p]').forEach(n=>n.contentEditable=true);
scrollTo(0,y);rot()}
let ri=0;
function rot(){const r=document.querySelector('.rot');if(r)r.textContent=list(D.roles)[ri%list(D.roles).length]||''}
setInterval(()=>{if(ed())return;ri++;const r=document.querySelector('.rot');if(!r)return;r.style.animation='none';r.offsetWidth;r.style.animation='';rot()},2400);
async function put(path,b64,msg){
let k=localStorage.gh||prompt('Paste your GitHub token (fine-grained, Contents: read and write, this repository only). It stays in this browser.');
if(!k)return false;localStorage.gh=k;
const u=`https://api.github.com/repos/${REPO}/contents/${path}`,h={Authorization:'Bearer '+k,Accept:'application/vnd.github+json'};
const g=await fetch(u,{headers:h});
const r=await fetch(u,{method:'PUT',headers:h,body:JSON.stringify({message:msg,content:b64,sha:g.ok?(await g.json()).sha:undefined})});
if(r.status===401)delete localStorage.gh;return r.ok}
const pick=()=>new Promise(r=>{const i=document.createElement('input');i.type='file';i.onchange=()=>r(i.files[0]);i.click()});
const GOOGLE_CLIENT_ID='';
const ALLOWED=['068d9448664fe76278ca393764a74e698d0e85682f89bf1e8d2064f3101c47a8', 'd6a443805c0110bbe269301c1b0ffbabea67a1a96d770ff105fe9108cfb349fc', 'ae9c2b9ffbbe772cd378892d4364b3cd7715aae509363600fec8db5c6479b539'];
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
function googleLogin(){return new Promise(res=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onerror=()=>res(false);s.onload=()=>{
const box=document.createElement('div');box.style.cssText='position:fixed;inset:0;z-index:99;display:grid;place-items:center;background:rgba(0,0,0,.55)';
box.innerHTML='<div style="background:var(--bg);color:var(--ink);padding:24px;border-radius:16px;text-align:center"><p>Sign in with an authorized Google account</p><div id="gb"></div><p><button id="gx" type="button">Cancel</button></p></div>';document.body.appendChild(box);
google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:async r=>{try{const p=JSON.parse(decodeURIComponent(escape(atob(r.credential.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))));box.remove();res(!!p.email_verified&&ALLOWED.includes(await sha(p.email.toLowerCase())))}catch(_){box.remove();res(false)}}});
google.accounts.id.renderButton($('gb'),{theme:'outline',size:'large'});
box.querySelector('#gx').onclick=()=>{box.remove();res(false)}};document.head.appendChild(s)})}
async function tokenOk(){const k=localStorage.gh||prompt('Edit mode is locked. Paste your GitHub token to unlock it.');if(!k)return false;
try{const r=await fetch('https://api.github.com/repos/'+REPO,{headers:{Authorization:'Bearer '+k}});const j=r.ok?await r.json():null;
if(j&&j.permissions&&j.permissions.push){localStorage.gh=k;return true}}catch(_){}
delete localStorage.gh;return false}
async function gate(){if(GOOGLE_CLIENT_ID&&!(await googleLogin())){toast('That Google account is not allowed.');return}
if(await tokenOk())enter();else toast('Access denied. Edit mode needs a valid GitHub token for this site.')}
function enter(){document.body.classList.add('edit');try{const s=localStorage.draft;if(s)D=JSON.parse(s)}catch(_){}render();toast('Edit mode: click any text to change it.')}
document.addEventListener('click',async e=>{
const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(b.id==='theme'){const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark'}
else if(b.id==='ed'){ed()?0:enter()}
else if(b.id==='ex')location.href=location.pathname;
else if(b.id==='rs'){try{delete localStorage.draft}catch(_){}location.href=location.pathname+'?edit'}
else if(b.id==='dl'){const l=document.createElement('a');l.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,1)],{type:'application/json'}));l.download='content.json';l.click()}
else if(b.id==='pub'){toast('Publishing…');const ok=await put('content.json',btoa(unescape(encodeURIComponent(JSON.stringify(D,null,1)))),'Update portfolio content');toast(ok?'Published. Your site updates in about a minute.':'Publish failed. Check your token and try again.');if(ok)try{delete localStorage.draft}catch(_){}}
else if(d.f){flt=d.f;document.querySelectorAll('.filters button').forEach(x=>x.setAttribute('aria-pressed',x===b));document.querySelectorAll('.proj').forEach(p=>p.hidden=!(flt==='all'||p.dataset.c===flt))}
else if(d.del){const a=d.del.split('.'),i=a.pop();get(a.join('.')).splice(i,1);save();render()}
else if(d.add){get(d.add).push(structuredClone(NEW[d.add]));save();render()}
else if(d.pr){const v=prompt(d.q,get(d.pr)||'');if(v!==null){set(d.pr,v.trim());save();render()}}
else if(d.photo!==undefined){const f=await pick();if(!f)return;toast('Resizing photo…');
const im=await createImageBitmap(f),s=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
const url=c.toDataURL('image/jpeg',.85);LP=url;render();toast('Uploading photo…');
if(await put('photo.jpg',url.split(',')[1],'Update profile photo')){set('photo','photo.jpg?v='+Date.now());save();toast('Photo uploaded. Press Publish so everyone sees it.')}else toast('Preview only: upload failed. Check your token.')}
else if(d.up){const f=await pick();if(!f)return;const n='docs/'+f.name.replace(/[^\w.-]+/g,'-');
const b64=await new Promise(r=>{const x=new FileReader();x.onload=()=>r(x.result.split(',')[1]);x.readAsDataURL(f)});
toast('Uploading…');if(await put(n,b64,'Add '+n)){set(d.up,n);save();render();toast('Uploaded. Publish to keep this change.')}else toast('Upload failed. Check your token.')}
});
document.addEventListener('input',e=>{const p=e.target.dataset&&e.target.dataset.p;if(p){set(p,e.target.textContent.trim());save()}});
document.addEventListener('paste',e=>{if(e.target.dataset&&e.target.dataset.p){e.preventDefault();document.execCommand('insertText',false,e.clipboardData.getData('text/plain'))}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.p)e.preventDefault()});
document.addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.proj,.doc');if(!c)return;const r=c.getBoundingClientRect();c.style.setProperty('--mx',e.clientX-r.left+'px');c.style.setProperty('--my',e.clientY-r.top+'px')});
addEventListener('scroll',()=>{$('pg').style.width=scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight)*100+'%'},{passive:true});
fetch('content.json',{cache:'no-cache'}).then(r=>r.ok?r.json():null).then(j=>{if(j)Object.assign(D,j)}).catch(()=>{}).finally(()=>{render();if(/[?&]edit/.test(location.search))gate()});
</script>
